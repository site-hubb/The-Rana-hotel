<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rana Restaurant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial;
}

body{
    background:#0a0a0a;
    color:white;
}

/* Navbar */
nav{
    position:fixed;
    width:100%;
    top:0;
    display:flex;
    justify-content:space-between;
    padding:15px 50px;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    z-index:1000;
}

nav h2{color:gold;}
nav a{
    color:white;
    margin:0 10px;
    text-decoration:none;
}

/* Hero */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.hero h1{
    font-size:55px;
    color:gold;
}

.btn{
    padding:12px 25px;
    margin:10px;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

.book{background:gold;color:black;}
.whatsapp{background:#25D366;color:white;}

/* Section */
section{
    padding:80px 20px;
    text-align:center;
}

/* Menu */
.menu{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.menu-item{
    background:#111;
    margin:10px;
    padding:20px;
    width:250px;
    border-radius:10px;
}

/* Gallery */
.gallery img{
    width:280px;
    margin:10px;
    border-radius:10px;
    transition:0.3s;
}
.gallery img:hover{
    transform:scale(1.1);
}

/* Form */
form{
    max-width:400px;
    margin:auto;
}
input,select{
    width:100%;
    padding:10px;
    margin:10px 0;
}

/* Footer */
footer{
    background:black;
    padding:20px;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav>
    <h2>The Rana Restaurant</h2>
    <div>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#gallery">Gallery</a>
        <a href="#booking">Book</a>
    </div>
</nav>

<!-- Hero -->
<div class="hero" id="home">
    <h1>Luxury Dining Experience</h1>
    <p>Welcome to The Rana Restaurant</p>

    <button class="btn book" onclick="scrollToSection('booking')">Book Now</button>

    <button class="btn whatsapp" onclick="whatsappMsg()">WhatsApp</button>
</div>

<!-- Menu -->
<section id="menu">
    <h2>Our Menu</h2>
    <div class="menu">
        <div class="menu-item">Paneer Butter Masala - ₹250</div>
        <div class="menu-item">Chicken Biryani - ₹300</div>
        <div class="menu-item">Pizza - ₹199</div>
        <div class="menu-item">Pasta - ₹180</div>
    </div>
</section>

<!-- Gallery -->
<section id="gallery" class="gallery">
    <h2>Gallery</h2>
    <img src="https://images.unsplash.com/photo-1555992336-03a23c6d7f6f">
    <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe">
    <img src="https://images.unsplash.com/photo-1551218808-94e220e084d2">
</section>

<!-- Booking -->
<section id="booking">
    <h2>Book a Table</h2>

    <form onsubmit="sendBooking(event)">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="date" id="date" required>
        <select id="people">
            <option>1 Person</option>
            <option>2 People</option>
            <option>3-5 People</option>
        </select>

        <button class="btn book" type="submit">Confirm Booking</button>
    </form>
</section>

<!-- Footer -->
<footer>
    <p>© 2026 The Rana Restaurant</p>
</footer>

<script>

/* Scroll */
function scrollToSection(id){
    document.getElementById(id).scrollIntoView({behavior:"smooth"});
}

/* WhatsApp */
function whatsappMsg(){
    let msg="Hello, I want to book a table at The Rana Restaurant";
    window.open("https://wa.me/911234567890?text="+encodeURIComponent(msg));
}

/* Booking Form */
function sendBooking(e){
    e.preventDefault();

    let name=document.getElementById("name").value;
    let date=document.getElementById("date").value;
    let people=document.getElementById("people").value;

    let msg=`Booking Request:
Name: ${name}
Date: ${date}
People: ${people}`;

    window.open("https://wa.me/911234567890?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
